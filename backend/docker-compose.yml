version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: Quantora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: Quantora_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Quantora-node-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: Quantora_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      PYTHON_AI_URL: http://fastapi-ai:8000
      JWT_SECRET: supersecretjwtkeyprod2026
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
